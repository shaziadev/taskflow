# One-time helper: unpacks the uploaded project archive into the repository.
name: Unpack project files
on:
  push:
    paths: [bundle.tar.gz]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive and commit
        run: |
          tar xzf bundle.tar.gz
          git rm -q bundle.tar.gz
          git add -A
          git -c user.name="Shazia Abbas" -c user.email="211013973+shaziadev@users.noreply.github.com" commit -m "Initial commit: TaskFlow Kanban app (Django REST API + React)"
          git push
